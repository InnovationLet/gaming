title: "InnovationLet Gaming"
short_title: "Gaming"
tagline: "Studios, platforms and the business of play."
description: >-
  InnovationLet Gaming covers studios, platforms, engines and esports
  as both culture and business. Independent reporting and analysis from
  the InnovationLet editorial desk.
author: "InnovationLet Editorial"
email: "hello@innovationlet.com"

lang: "en"
locale: "en_US"

url: "https://innovationlet.github.io"
baseurl: "/gaming"
main_site: "https://innovationlet.github.io"

category_name: "Gaming"
category_meta: "Studios · Platforms · Esports"
accent: "yellow"
hero_title: "Games, and the industry that makes them."
hero_lead: >-
  Studios, platforms and esports, covered as both culture and business,
  with the budgets and business models in view.

logo: "/favicon.svg"

twitter_username: "innovationlet"
github_username: "innovationlet"
linkedin_username: "innovationlet"

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: "feed.xml"

show_excerpts: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/images/og-image.png"
        width: 1200
        height: 630
        alt: "InnovationLet — technology and innovation, decoded"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "InnovationLet Editorial"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor"
